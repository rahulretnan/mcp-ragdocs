services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # GRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_ALLOW_RECOVERY=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:0.5.11
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model:
    image: ollama/ollama:0.5.11
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}}
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: ["ollama"]
    command: ["pull", "${EMBEDDING_MODEL:-${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}}"]
    restart: "no"

volumes:
  qdrant_storage:
  ollama_storage:
